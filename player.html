<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LzPlayer PRO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root { 
    --netflix-red: #E50914;
    --netflix-black: #141414;
}

body {
    margin: 0;
    background: #000;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
}

#player {
    position: relative;
    width: 100%;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

#backdrop-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background-size: cover;
    background-position: center;
    transition: opacity 0.8s ease;
}

video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: relative;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.8s ease;
}

/* CONTROLES - NUEVO ESTILO NETFLIX */
.controls {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px 50px 35px;
    background: linear-gradient(
        to top,
        rgba(0,0,0,0.95) 0%,
        rgba(0,0,0,0.4) 40%,
        rgba(0,0,0,0.2) 70%,
        transparent 100%
    );
    z-index: 3;
    transition: opacity 0.4s ease;
    opacity: 1;
}
.controls.hide { opacity: 0; pointer-events: none; }

.top {
    color: white;
    font-size: 28px;
    font-weight: 700;
    text-shadow: 0 4px 12px rgba(0,0,0,0.9);
}

.center {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 45px;
}

.btn {
    color: #fff;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 12px;
    border-radius: 50%;
}

.btn:hover {
    color: var(--netflix-red);
    transform: scale(1.25);
}

.btn.big {
    font-size: 92px;
    padding: 18px;
    background: rgba(0,0,0,0.75);
    border: 3px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(8px);
}

.btn-rewind, .btn-forward {
    font-size: 42px;
}

.bottom {
    display: flex;
    align-items: center;
    gap: 18px;
    color: #fff;
}
.bottom span {
    font-size: 15px;
    min-width: 68px;
    font-variant-numeric: tabular-nums;
}

input[type="range"] {
    flex: 1;
    height: 5px;
    accent-color: var(--netflix-red);
    cursor: pointer;
    border-radius: 5px;
}

#fullscreenBtn {
    margin-left: auto;
    font-size: 26px;
}

/* Menú y modal (mantenido limpio) */
.settings-menu {
    position: absolute;
    bottom: 100px;
    right: 50px;
    background: rgba(20,20,20,0.97);
    border-radius: 14px;
    padding: 10px 0;
    min-width: 280px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    border: 1px solid #333;
    z-index: 10;
    display: none;
}
.settings-menu.show { display: flex; flex-direction: column; }

.quality-option {
    padding: 14px 24px;
    color: #fff;
    cursor: pointer;
    font-size: 15.5px;
}
.quality-option:hover {
    background: rgba(255,255,255,0.1);
}
.quality-option.active {
    color: var(--netflix-red);
    background: rgba(229,9,20,0.15);
}

/* Loader y Modal */
.quality-loader {
    position: absolute; inset: 0; z-index: 5;
    background: rgba(0,0,0,0.85);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    gap: 16px;
}
.quality-loader.show { display: flex; }

.spinner {
    width: 55px; height: 55px;
    border: 6px solid rgba(255,255,255,0.15);
    border-top-color: var(--netflix-red);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.resume-modal {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(0,0,0,0.92);
    display: none; align-items: center; justify-content: center;
}
.resume-modal.show { display: flex; }

.resume-content {
    background: #1f1f1f;
    padding: 40px 45px;
    border-radius: 18px;
    text-align: center;
    max-width: 460px;
    border: 1px solid #333;
}
.resume-buttons button {
    padding: 14px 36px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 6px;
}
#btn-continue {
    background: var(--netflix-red);
    color: white;
}
#btn-restart {
    background: #333;
    color: white;
}

@media (max-width: 768px) {
    .btn.big { font-size: 72px; }
    .center { gap: 35px; }
    .controls { padding: 25px 30px 20px; }
}
</style>
</head>
<body>
<div id="player">
    <div id="backdrop-overlay"></div>
    <video id="video" playsinline></video>

    <div id="quality-loader" class="quality-loader">
        <div class="spinner"></div>
        <span>Cambiando calidad...</span>
    </div>

    <div class="controls" id="controls">
        <div class="top">
            <span id="title-text">Cargando...</span>
        </div>
     
        <div class="center">
            <i class="fas fa-rotate-left btn" id="rewindBtn" onclick="rewind()"></i>
            <i class="fas fa-play btn big" id="playBtn" onclick="togglePlay()"></i>
            <i class="fas fa-rotate-right btn" id="forwardBtn" onclick="forward()"></i>
        </div>
     
        <div class="bottom">
            <span id="current">00:00:00</span>
            <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
            <span id="total">00:00:00</span>
            <i class="fas fa-cog btn" id="settingsBtn" title="Configuración"></i>
            <i class="fas fa-expand btn" id="fullscreenBtn" title="Pantalla completa"></i>
        </div>
    </div>

    <div id="settings-menu" class="settings-menu">
        <div class="settings-header" style="padding:12px 24px; color:#aaa; font-weight:600;">Calidad</div>
        <div id="quality-options"></div>
    </div>

    <div id="resume-modal" class="resume-modal">
        <div class="resume-content">
            <p id="resume-text">Te quedaste en 00:00:00.<br>¿Quieres continuar desde ahí?</p>
            <div class="resume-buttons">
                <button id="btn-continue">Sí, continuar</button>
                <button id="btn-restart">No, desde el principio</button>
            </div>
        </div>
    </div>
</div>

<script>
const video = document.getElementById("video");
const player = document.getElementById("player");
const playBtn = document.getElementById("playBtn");
const controls = document.getElementById("controls");
const seek = document.getElementById("seek");
const titleEl = document.getElementById("title-text");
const currentTimeEl = document.getElementById("current");
const totalTimeEl = document.getElementById("total");
const backdropOverlay = document.getElementById("backdrop-overlay");
const settingsMenu = document.getElementById("settings-menu");
const qualityContainer = document.getElementById("quality-options");
const qualityLoader = document.getElementById("quality-loader");
const resumeModal = document.getElementById("resume-modal");
const resumeText = document.getElementById("resume-text");
const btnContinue = document.getElementById("btn-continue");
const btnRestart = document.getElementById("btn-restart");
const rewindBtn = document.getElementById("rewindBtn");
const forwardBtn = document.getElementById("forwardBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");

const params = new URLSearchParams(window.location.search);
let VIDEO_URL = params.get('video') ? decodeURIComponent(params.get('video')) : '';
let POSTER_URL = params.get('poster') ? decodeURIComponent(params.get('poster')) : '';
let TITLE = params.get('title') ? decodeURIComponent(params.get('title')) : 'Reproduciendo';

let hlsInstance = null;
let hasStarted = false;
let saveInterval = null;

// Fullscreen + Horizontal automático
async function goFullscreenAndLandscape() {
    try {
        if (!document.fullscreenElement) {
            await player.requestFullscreen?.() || player.webkitRequestFullscreen?.();
        }
    } catch(e) {}

    try {
        if (screen.orientation?.lock) await screen.orientation.lock('landscape');
    } catch(e) {}
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        player.requestFullscreen?.() || player.webkitRequestFullscreen?.();
    } else {
        document.exitFullscreen?.();
    }
}

// Funciones principales
function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return "00:00:00";
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    return `${h}:${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
}

function hideBackdropAndShowVideo() {
    backdropOverlay.style.opacity = "0";
    setTimeout(() => backdropOverlay.style.display = "none", 800);
    video.style.opacity = "1";
}

function togglePlay() {
    if (video.paused) {
        if (!hasStarted) {
            hideBackdropAndShowVideo();
            hasStarted = true;
            goFullscreenAndLandscape();
        }
        video.play();
    } else {
        video.pause();
    }
}

function rewind() { video.currentTime -= 10; }
function forward() { video.currentTime += 10; }

// Inicialización
function loadMetadata() {
    titleEl.textContent = TITLE;
    if (POSTER_URL) {
        backdropOverlay.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('${POSTER_URL}')`;
    }
    if (VIDEO_URL) {
        if (VIDEO_URL.includes(".m3u8") && Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(VIDEO_URL);
            hlsInstance.attachMedia(video);
        } else {
            video.src = VIDEO_URL;
        }
    }
}

function initPlayer() {
    loadMetadata();

    video.addEventListener("loadedmetadata", () => {
        totalTimeEl.textContent = formatTime(video.duration);
    });

    video.addEventListener("timeupdate", () => {
        if (video.duration) {
            seek.value = (video.currentTime / video.duration) * 100;
            currentTimeEl.textContent = formatTime(video.currentTime);
        }
    });

    seek.addEventListener("input", () => {
        video.currentTime = (seek.value / 100) * video.duration;
    });

    video.addEventListener("play", () => playBtn.className = "fas fa-pause btn big");
    video.addEventListener("pause", () => playBtn.className = "fas fa-play btn big");

    fullscreenBtn.addEventListener("click", toggleFullscreen);

    // Controles
    let timeout;
    const showControls = () => {
        controls.classList.remove("hide");
        clearTimeout(timeout);
        timeout = setTimeout(() => {
            if (!video.paused) controls.classList.add("hide");
        }, 2800);
    };

    document.addEventListener("mousemove", showControls);
    document.addEventListener("touchstart", showControls);
    video.addEventListener("click", togglePlay);
}

initPlayer();
</script>
</body>
</html>
