<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LzPlayer PRO</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root { 
    --primary: #E50914;     /* Color Netflix */
    --text: #ffffff;
}

body {
    margin: 0; 
    background: #000; 
    font-family: 'Segoe UI', system-ui, sans-serif; 
    overflow: hidden;
}

#player {
    position: relative; 
    width: 100%; 
    height: 100vh; 
    background: #000; 
    overflow: hidden;
}

#backdrop-overlay {
    position: absolute; inset: 0; z-index: 1;
    background-size: cover; background-position: center; 
    transition: opacity 0.6s ease;
}

video {
    width: 100%; height: 100%; 
    object-fit: cover; 
    position: relative; z-index: 2;
    opacity: 0; transition: opacity 0.6s ease;
}

/* === CONTROLES ESTILO NETFLIX === */
.controls {
    position: absolute; inset: 0; 
    display: flex; flex-direction: column;
    justify-content: space-between; 
    padding: 30px 40px;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, transparent 35%, transparent 65%, rgba(0,0,0,0.88) 100%);
    z-index: 3; 
    transition: opacity 0.4s ease;
    opacity: 1;
}
.controls.hide { opacity: 0; pointer-events: none; }

.top {
    color: #fff; 
    font-size: 26px; 
    font-weight: 700; 
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.center {
    display: flex; 
    justify-content: center; 
    align-items: center; 
    gap: 50px;
}

.btn {
    color: #fff; 
    font-size: 32px; 
    cursor: pointer; 
    transition: all 0.25s ease;
    text-shadow: 0 3px 10px rgba(0,0,0,0.7);
    padding: 8px;
    border-radius: 50%;
}

.btn:hover {
    color: var(--primary);
    transform: scale(1.2);
    background: rgba(255,255,255,0.12);
}

.btn.big {
    font-size: 82px;
    padding: 15px;
    background: rgba(0,0,0,0.65);
    border: 2px solid rgba(255,255,255,0.25);
}

.btn:active { transform: scale(0.9); }

.btn-rewind, .btn-forward {
    font-size: 38px;
}

.bottom {
    display: flex; 
    align-items: center; 
    gap: 15px; 
    color: #fff;
}
.bottom span { 
    font-size: 14px; 
    font-variant-numeric: tabular-nums; 
    min-width: 65px; 
}

#fullscreenBtn {
    margin-left: auto;
    font-size: 28px;
}

input[type="range"] { 
    flex: 1; 
    cursor: pointer; 
    accent-color: var(--primary); 
    height: 6px;
    border-radius: 3px;
}

/* MENÚ CONFIGURACIÓN */
.settings-menu {
    position: absolute; bottom: 90px; right: 40px;
    background: rgba(20,20,20,0.98); 
    border-radius: 12px; 
    padding: 12px 0;
    min-width: 260px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.1); 
    z-index: 10; 
    display: none; 
    flex-direction: column;
}
.settings-menu.show { display: flex; }

.settings-header { 
    padding: 10px 20px; 
    font-size: 14px; 
    font-weight: 600; 
    color: #aaa; 
    border-bottom: 1px solid rgba(255,255,255,0.1); 
    margin-bottom: 6px; 
}

.quality-option {
    padding: 12px 20px; 
    font-size: 15px; 
    color: #fff; 
    cursor: pointer;
    transition: background 0.2s; 
    display: flex; 
    align-items: center; 
    gap: 10px;
}
.quality-option:hover { background: rgba(255,255,255,0.08); }
.quality-option.active { color: var(--primary); font-weight: 600; }
.quality-option .check { margin-left: auto; color: var(--primary); }

/* LOADER */
.quality-loader {
    position: absolute; inset: 0; z-index: 5;
    background: rgba(0,0,0,0.8);
    display: none; flex-direction: column; 
    align-items: center; justify-content: center;
    color: #fff; gap: 14px;
}
.quality-loader.show { display: flex; }

.spinner {
    width: 50px; height: 50px;
    border: 5px solid rgba(255,255,255,0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* MODAL REANUDAR */
.resume-modal {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(0,0,0,0.9);
    display: none; align-items: center; justify-content: center;
}
.resume-modal.show { display: flex; }

.resume-content {
    background: #1a1a1a;
    padding: 35px 40px;
    border-radius: 16px;
    text-align: center;
    max-width: 420px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    border: 1px solid rgba(255,255,255,0.1);
}
.resume-content p {
    color: #fff;
    font-size: 18px;
    margin-bottom: 30px;
    line-height: 1.5;
}
.resume-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
}
.resume-buttons button {
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
}
#btn-continue {
    background: var(--primary);
    color: #000;
}
#btn-continue:hover { background: #f40612; }
#btn-restart {
    background: #333;
    color: #fff;
}
#btn-restart:hover { background: #444; }

@media (max-width: 768px) {
    .btn.big { font-size: 65px; }
    .btn { font-size: 28px; }
    .center { gap: 35px; }
    .controls { padding: 20px 25px; }
    .settings-menu { right: 25px; min-width: 230px; }
}
</style>
</head>
<body>
<div id="player">
    <div id="backdrop-overlay"></div>
    <video id="video" playsinline></video>

    <div id="quality-loader" class="quality-loader">
        <div class="spinner"></div>
        <span>Cambiando calidad...</span>
    </div>

    <div class="controls" id="controls">
        <div class="top" id="title">
            <div class="top-left">
                <span id="title-text">Cargando...</span>
            </div>
        </div>
     
        <div class="center">
            <i class="fas fa-rotate-left btn" id="rewindBtn" onclick="rewind()"></i>
            <i class="fas fa-play btn big" id="playBtn" onclick="togglePlay()"></i>
            <i class="fas fa-rotate-right btn" id="forwardBtn" onclick="forward()"></i>
        </div>
     
        <div class="bottom">
            <span id="current">00:00:00</span>
            <input type="range" id="seek" value="0" min="0" max="100" step="0.1">
            <span id="total">00:00:00</span>
            <i class="fas fa-cog btn" id="settingsBtn" title="Configuración"></i>
            <i class="fas fa-expand btn" id="fullscreenBtn" title="Pantalla completa"></i>
        </div>
    </div>

    <div id="settings-menu" class="settings-menu">
        <div class="settings-header">Calidad de video</div>
        <div id="quality-options"></div>
    </div>

    <div id="resume-modal" class="resume-modal">
        <div class="resume-content">
            <p id="resume-text">Te quedaste en 00:00:00.<br>¿Quieres continuar desde ahí?</p>
            <div class="resume-buttons">
                <button id="btn-continue">Sí, continuar</button>
                <button id="btn-restart">No, empezar desde el principio</button>
            </div>
        </div>
    </div>
</div>

<script>
const video = document.getElementById("video");
const playBtn = document.getElementById("playBtn");
const controls = document.getElementById("controls");
const seek = document.getElementById("seek");
const titleEl = document.getElementById("title-text");
const currentTimeEl = document.getElementById("current");
const totalTimeEl = document.getElementById("total");
const backdropOverlay = document.getElementById("backdrop-overlay");
const settingsBtn = document.getElementById("settingsBtn");
const settingsMenu = document.getElementById("settings-menu");
const qualityContainer = document.getElementById("quality-options");
const qualityLoader = document.getElementById("quality-loader");
const resumeModal = document.getElementById("resume-modal");
const resumeText = document.getElementById("resume-text");
const btnContinue = document.getElementById("btn-continue");
const btnRestart = document.getElementById("btn-restart");
const rewindBtn = document.getElementById("rewindBtn");
const forwardBtn = document.getElementById("forwardBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const player = document.getElementById("player");

const params = new URLSearchParams(window.location.search);
let VIDEO_URL = params.get('video') ? decodeURIComponent(params.get('video')) : '';
let POSTER_URL = params.get('poster') ? decodeURIComponent(params.get('poster')) : '';
let TITLE = params.get('title') ? decodeURIComponent(params.get('title')) : 'Reproduciendo';

const STORAGE_KEY = `lzplayer_resume_${btoa(VIDEO_URL || 'unknown').replace(/[^a-zA-Z0-9]/g, '').slice(0, 50)}`;

let hlsInstance = null;
let hasStarted = false;
let isChangingQuality = false;
let saveInterval = null;

// ==================== FULLSCREEN + LANDSCAPE AUTOMÁTICO ====================
async function goFullscreenAndLandscape() {
    try {
        if (!document.fullscreenElement) {
            if (player.requestFullscreen) await player.requestFullscreen();
            else if (player.webkitRequestFullscreen) await player.webkitRequestFullscreen();
        }
    } catch (e) {}

    try {
        if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape');
        }
    } catch (e) {}
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        player.requestFullscreen?.() || player.webkitRequestFullscreen?.();
    } else {
        document.exitFullscreen?.() || document.webkitExitFullscreen?.();
    }
}

fullscreenBtn.addEventListener("click", (e) => {
    e.stopImmediatePropagation();
    toggleFullscreen();
});

player.addEventListener("dblclick", (e) => {
    if (e.target.closest('.controls') || e.target.closest('.settings-menu') || 
        e.target.closest('.resume-modal') || e.target.tagName === "INPUT") return;
    toggleFullscreen();
});

// ==================== FUNCIONES BÁSICAS ====================
function formatTime(seconds) {
    if (!seconds || isNaN(seconds)) return "00:00:00";
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    return `${h}:${m < 10 ? "0" + m : m}:${s < 10 ? "0" + s : s}`;
}

function saveProgress() {
    if (video.currentTime > 5 && VIDEO_URL) {
        localStorage.setItem(STORAGE_KEY, video.currentTime);
    }
}

function loadSavedProgress() {
    if (!VIDEO_URL) return;
    const savedTime = parseFloat(localStorage.getItem(STORAGE_KEY));
    if (savedTime && savedTime > 10) {
        resumeText.innerHTML = `Te quedaste en <strong>${formatTime(savedTime)}</strong>.<br>¿Quieres continuar desde ahí?`;
        resumeModal.classList.add("show");
        
        btnContinue.onclick = () => {
            video.currentTime = savedTime;
            resumeModal.classList.remove("show");
            hideBackdropAndShowVideo();
            hasStarted = true;
            video.play();
        };
        btnRestart.onclick = () => {
            localStorage.removeItem(STORAGE_KEY);
            resumeModal.classList.remove("show");
            hideBackdropAndShowVideo();
            hasStarted = true;
            video.play();
        };
    }
}

function hideBackdropAndShowVideo() {
    backdropOverlay.style.opacity = "0";
    setTimeout(() => { backdropOverlay.style.display = "none"; }, 600);
    video.style.opacity = "1";
}

function togglePlay() {
    if (video.paused) {
        if (!hasStarted) {
            hideBackdropAndShowVideo();
            hasStarted = true;
            goFullscreenAndLandscape();
        }
        video.play().catch(() => {});
    } else {
        video.pause();
    }
}

function rewind() {
    rewindBtn.classList.add("btn-rewind");
    setTimeout(() => rewindBtn.classList.remove("btn-rewind"), 450);
    video.currentTime = Math.max(0, video.currentTime - 10);
}

function forward() {
    forwardBtn.classList.add("btn-forward");
    setTimeout(() => forwardBtn.classList.remove("btn-forward"), 450);
    video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
}

// ==================== HLS Y CALIDAD ====================
function loadVideo(url) {
    if (url.includes(".m3u8") && Hls.isSupported()) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
    } else {
        video.src = url;
    }
}

function loadQualityOptions() {
    qualityContainer.innerHTML = "";
    if (!hlsInstance || !hlsInstance.levels.length) {
        qualityContainer.innerHTML = `<div class="quality-option">No hay calidades disponibles</div>`;
        return;
    }
    // Código de calidades (puedes expandirlo más si quieres)
    const autoOption = document.createElement("div");
    autoOption.className = "quality-option active";
    autoOption.innerHTML = `Auto (Recomendado)`;
    qualityContainer.appendChild(autoOption);
}

settingsBtn.addEventListener("click", (e) => {
    e.stopImmediatePropagation();
    settingsMenu.classList.toggle("show");
    if (settingsMenu.classList.contains("show") && hlsInstance) loadQualityOptions();
});

document.addEventListener("click", (e) => {
    if (!settingsMenu.contains(e.target) && e.target !== settingsBtn) {
        settingsMenu.classList.remove("show");
    }
});

// ==================== INICIALIZACIÓN ====================
function loadMetadata() {
    titleEl.textContent = TITLE || "Reproduciendo";
    if (POSTER_URL) {
        backdropOverlay.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${POSTER_URL}')`;
    }
    if (VIDEO_URL) loadVideo(VIDEO_URL);
}

function initPlayer() {
    loadMetadata();
    
    video.addEventListener("loadedmetadata", () => {
        totalTimeEl.textContent = formatTime(video.duration);
        loadSavedProgress();
    });

    video.addEventListener("timeupdate", () => {
        const c = video.currentTime;
        const t = video.duration;
        if (!isNaN(t) && t > 0) {
            seek.value = (c / t) * 100;
            currentTimeEl.textContent = formatTime(c);
        }
    });

    seek.addEventListener("input", () => {
        if (video.duration) video.currentTime = (seek.value / 100) * video.duration;
    });

    video.addEventListener("play", () => { 
        playBtn.className = "fas fa-pause btn big"; 
    });
    video.addEventListener("pause", () => { 
        playBtn.className = "fas fa-play btn big"; 
    });

    document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if (e.code === "Space") { e.preventDefault(); togglePlay(); }
        if (e.code === "ArrowLeft") rewind();
        if (e.code === "ArrowRight") forward();
        if (e.code === "KeyF") toggleFullscreen();
    });

    // Mostrar/ocultar controles
    let hideTimeout;
    function showControls() {
        controls.classList.remove("hide");
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
            if (!video.paused) controls.classList.add("hide");
        }, 3000);
    }
    document.addEventListener("mousemove", showControls);
    document.addEventListener("touchstart", showControls);
    video.addEventListener("click", togglePlay);
}

initPlayer();
</script>
</body>
</html>
